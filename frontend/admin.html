<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupcakes Gourmet — Painel Administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Karla:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  #app { padding-bottom: 20px; }
  .abas-admin { display: flex; gap: 8px; padding: 0 20px 16px; }
  .abas-admin button { flex: 1; }
</style>
</head>
<body>
<div id="app">

  <header class="topo">
    <div class="marca" style="font-size:1.05rem">🔑 Painel Admin</div>
    <button class="icone-botao" onclick="sairAdmin()" aria-label="Sair">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <div id="login-admin" class="container">
    <div class="cartao">
      <h2>Acesso restrito</h2>
      <p>Entre com sua conta de administrador.</p>
      <div id="erro-admin"></div>
      <form id="form-login-admin">
        <div class="campo"><label for="admin-email">E-mail</label><input type="email" id="admin-email" required autocomplete="username"></div>
        <div class="campo"><label for="admin-senha">Senha</label><input type="password" id="admin-senha" required autocomplete="current-password"></div>
        <button class="botao botao-primario" type="submit">Entrar no painel</button>
      </form>
    </div>
  </div>

  <div id="painel" style="display:none">
    <div class="abas-admin">
      <button class="chip ativo" id="aba-produtos" onclick="mudarAbaAdmin('produtos')">Produtos</button>
      <button class="chip" id="aba-pedidos" onclick="mudarAbaAdmin('pedidos')">Pedidos</button>
    </div>
    <div id="conteudo-admin" class="container" style="padding-top:0"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
