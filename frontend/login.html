<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupcakes Gourmet — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Karla:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" style="padding-bottom:20px">

  <div class="container" style="padding-top:56px">
    <div class="centro" style="margin-bottom:34px">
      <div style="font-size:2.6rem; margin-bottom:6px">🧁</div>
      <h1>Cupcakes Gourmet</h1>
      <p>Doces artesanais, direto na sua porta.</p>
    </div>

    <div class="filtros" style="padding:0; margin-bottom:22px; justify-content:center">
      <button class="chip ativo" id="aba-login" onclick="mudarAba('login')" style="flex:1; text-align:center">Entrar</button>
      <button class="chip" id="aba-cadastro" onclick="mudarAba('cadastro')" style="flex:1; text-align:center">Criar conta</button>
    </div>

    <div id="erro-form"></div>

    <form id="form-login">
      <div class="campo"><label for="login-email">E-mail</label><input type="email" id="login-email" required autocomplete="email"></div>
      <div class="campo"><label for="login-senha">Senha</label><input type="password" id="login-senha" required autocomplete="current-password"></div>
      <button class="botao botao-primario" type="submit">Entrar</button>
      <p class="centro" style="margin-top:14px"><a href="#" id="link-esqueci" class="link-acao" style="color:var(--framboesa); font-weight:700; font-size:0.85rem">Esqueci minha senha</a></p>
    </form>

    <form id="form-recuperar" style="display:none">
      <h2>Recuperar senha</h2>
      <p>Informe o e-mail da sua conta. Enviaremos um link válido por 60 minutos.</p>
      <div class="campo"><label for="rec-email">E-mail</label><input type="email" id="rec-email" required autocomplete="email"></div>
      <button class="botao botao-primario" type="submit">Enviar link de recuperação</button>
      <p class="centro" style="margin-top:14px"><a href="#" id="link-voltar" class="link-acao" style="color:var(--framboesa); font-weight:700; font-size:0.85rem">← Voltar para o login</a></p>
      <div id="resultado-recuperacao" style="margin-top:14px"></div>
    </form>

    <form id="form-cadastro" style="display:none">
      <div class="campo"><label for="cad-nome">Nome completo</label><input type="text" id="cad-nome" required autocomplete="name"></div>
      <div class="campo"><label for="cad-email">E-mail</label><input type="email" id="cad-email" required autocomplete="email"></div>
      <div class="campo"><label for="cad-senha">Senha (mínimo 8 caracteres)</label><input type="password" id="cad-senha" required minlength="8" autocomplete="new-password"></div>
      <button class="botao botao-primario" type="submit">Criar conta</button>
    </form>

    <p class="centro" style="margin-top:20px; font-size:0.8rem">
      Painel administrativo? <a href="admin.html" class="link-acao" style="color:var(--framboesa); font-weight:700">Acessar aqui</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
